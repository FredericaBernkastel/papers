name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # keep in sync with "packageManager" in package.json
          bun-version: 1.3.14

      # outputs base_path: "/papers" for this project page, "/" for a user site.
      # normalizeBasePath() in src/lib/base-path.ts turns "/" back into "".
      - id: pages
        uses: actions/configure-pages@v5

      - run: bun install --frozen-lockfile

      # the same gate as local: gen:math, strict tsc, strict eslint
      - run: bun run check

      - run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # belt and braces: the Actions deploy path does not run Jekyll, but if the
      # repo is ever switched to branch-based Pages, _next/ would be dropped
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
